services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: autoclip-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

  # Main Application Service (Development Mode)
  autoclip-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autoclip-app-dev
    restart: unless-stopped
    ports:
      - "8000:8000"  # Backend API
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/venv  # Exclude virtual environment
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    command: >
      sh -c "
        source venv/bin/activate &&
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Celery Worker Service (Development Mode)
  celery-worker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: autoclip-celery-worker-dev
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/venv
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/autoclip.db
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    command: >
      sh -c "
        source venv/bin/activate &&
        celery -A backend.core.celery_app worker --loglevel=debug --reload
      "
    depends_on:
      - redis
      - autoclip-dev

volumes:
  redis_dev_data:
    driver: local

networks:
  default:
    name: autoclip-dev-network
